# Development Docker Compose Stack
# NOTE: Backend/Frontend containerized dev removed — run both locally (IDE / npm).
# Use the top-level `docker-compose.yml` (or this file) only to start the DB container.
# Usage: docker compose -f compose.dev.yml --env-file .env.dev up -d

services:
  physio-dev-db:
    image: mysql:8.0.36
    container_name: ${COMPOSE_PROJECT_NAME:-physio-dev}-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-physiocalendar_dev}
      MYSQL_USER: ${DB_USER:-physiouser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devpassword}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-devrootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - physio-dev-db-data:/var/lib/mysql
      - ./backups:/backup
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - physio-dev-network

  # Backup-Utility Container für mysqldump ohne lokale Installation
  physio-dev-backup:
    image: mysql:8.0.36
    container_name: ${COMPOSE_PROJECT_NAME:-physio-dev}-backup
    depends_on:
      physio-dev-db:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-physiocalendar_dev}
      DB_USER: ${DB_USER:-physiouser}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      DB_HOST: physio-dev-db
      DB_PORT: "3306"
      DB_ENV: dev
      BACKUP_DIR: /backup
    volumes:
      - ./backups:/backup
      - ./mysql_backup.sh:/scripts/mysql_backup.sh:ro
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      - physio-dev-network

# Removed: physio-dev-backend + physio-dev-frontend — run locally with `./mvnw spring-boot:run` and `npm run dev`.
# If you need containerized dev versions, re-add the service blocks or use `compose.test.yml` for containerized testing.

volumes:
  physio-dev-db-data:
    name: physio-dev-db-data
    external: true

networks:
  physio-dev-network:
    name: physio-dev-network
    driver: bridge
    external: true
