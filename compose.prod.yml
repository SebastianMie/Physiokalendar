# Production Docker Compose Stack
# Ports: Frontend 80/443, Backend 8080 (internal), DB 3308 (internal)
# Usage: docker compose -f compose.prod.yml --env-file .env.prod up -d
# Usage: docker compose -f compose.prod.yml --env-file .env.prod up -d --build

services:
  physio-prod-db:
    image: mysql:8.0.36
    container_name: ${COMPOSE_PROJECT_NAME:-physio-prod}-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-physiocalendar}
      MYSQL_USER: ${DB_USER:-physiouser}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - physio-prod-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - physio-prod-network

  physio-prod-backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: physio-prod-backend
    image: physio-prod-backend:latest
    restart: always
    depends_on:
      physio-prod-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://physio-prod-db:3306/${DB_NAME:-physiocalendar_prod}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-physiouser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENVIRONMENT: prod
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_REDIRECT_ALL: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SEED_DATA_ENABLED: "false"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./logs:/usr/src/app/logs
      - ./backups:/backup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - physio-prod-network

