# Production Docker Compose Stack
# Ports: Frontend 80/443, Backend 8080 (internal), DB 3308 (internal)
# Usage: docker compose -f compose.prod.yml --env-file .env.prod up -d

services:
  physio-prod-db:
    image: mysql:8.0.36
    container_name: physio-prod-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-physiocalendar}
      MYSQL_USER: ${DB_USER:-physiouser}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - physio-prod-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - physio-prod-network

  physio-prod-backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: physio-prod-backend
    restart: always
    depends_on:
      physio-prod-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://physio-prod-db:3306/${DB_NAME:-physiocalendar}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-physiouser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENVIRONMENT: prod
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_REDIRECT_ALL: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SEED_DATA_ENABLED: "false"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - physio-prod-network

  physio-prod-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BUILD_ENV: production
    container_name: physio-prod-frontend
    restart: always
    depends_on:
      - physio-prod-backend
    environment:
      API_URL: http://physio-prod-backend:8080
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    networks:
      - physio-prod-network

volumes:
  physio-prod-db-data:
    name: physio-prod-db-data

networks:
  physio-prod-network:
    name: physio-prod-network
    driver: bridge
