  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/" ]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 5s
  #   networks:
  #     - physio-prod-network
  physio-prod-backup:
      build:
        context: .
        dockerfile: Dockerfile.backup
      container_name: ${COMPOSE_PROJECT_NAME:-physio-prod}-backup
      image: ${COMPOSE_PROJECT_NAME:-physio-prod}-backup:latest
      restart: unless-stopped
      environment:
        DB_HOST: physio-prod-db
        DB_PORT: 3306
        DB_NAME: ${DB_NAME:-physiocalendar_prod}
        DB_USER: ${DB_USER:-physiouser}
        DB_PASSWORD: ${DB_PASSWORD:-prodpassword}
        DB_ENV: prod
      volumes:
        - ./backups:/backup
      networks:
        - physio-prod-network
      depends_on:
        physio-prod-db:
          condition: service_healthy

volumes:
  physio-prod-db-data:
    name: physio-prod-db-data

networks:
  physio-prod-network:
    name: physio-prod-network
    driver: bridge
