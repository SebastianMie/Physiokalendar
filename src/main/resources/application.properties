spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/physiocalendar
spring.datasource.username=physiouser
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.port=8080
# ========================================
# DATENIMPORT KONFIGURATION
# ========================================
# Setzen Sie auf 'true' um Daten beim Startup automatisch zu importieren
# Set to 'false' um den automatischen Import zu deaktivieren
app.dataimport.enabled=false
app.dataimport.filepath=src/main/java/com/example/physiokalendar/dataimport/backup.json

# ========================================
# SERIES-ONLY IMPORT BEI STARTUP
# ========================================
# Aktiviert automatischen Series-Only Import beim Anwendungsstart
# Keine Timeout-Probleme durch synchrone Ausführung
app.dataimport.series.enabled=false
app.dataimport.series.filepath=src/main/java/com/example/physiokalendar/dataimport/backup.json