# Application Profile: Production
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/physiocalendar}
    username: ${SPRING_DATASOURCE_USERNAME:physiouser}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
  flyway:
    enabled: false   # Flyway in Produktion standardmäßig deaktiviert — DB wird per dump/backup gepflegt
    locations: classpath:db/migration
    baselineOnMigrate: false

# Application Config
app:
  environment: prod
  seed-data-enabled: false

# Set correct port for production
server:
  port: 8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Mail Configuration
mail:
  enabled: ${MAIL_ENABLED:false}
  redirect:
    all: false
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

# Audit Configuration
audit:
  log-before-after: false
  log-metadata: true

logging:
  level:
    root: WARN
    com.example.physiokalendar: INFO
    org.flywaydb: WARN
  file:
    name: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
