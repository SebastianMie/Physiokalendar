# DevTools Konfiguration für optimales Hot-Reload
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1000ms
spring.devtools.restart.quiet-period=400ms
spring.devtools.livereload.enabled=true

# Optional: Dateien ausschließen von Restart
spring.devtools.restart.exclude=**/*.properties,**/*.yml,logs/**

# ===========================================
# DATENIMPORT beim Start
# Auf true setzen um Import beim Startup auszuführen
# Nach erfolgreichem Import wieder auf false setzen!
# ===========================================
app.dataimport.enabled=false
app.dataimport.filepath=src/main/java/com/example/physiokalendar/dataimport/backup.json
