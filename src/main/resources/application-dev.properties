# DevTools Konfiguration für optimales Hot-Reload
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1000ms
spring.devtools.restart.quiet-period=400ms
spring.devtools.livereload.enabled=true

# Optional: Dateien ausschließen von Restart
spring.devtools.restart.exclude=**/*.properties,**/*.yml,logs/**

# ===========================================
# DATENIMPORT beim Start
# Auf true setzen um Import beim Startup auszuführen
# Nach erfolgreichem Import wieder auf false setzen!
# ===========================================
app.dataimport.enabled=false
app.dataimport.filepath=src/main/java/com/example/physiokalendar/dataimport/backup.json

# ===========================================
# SERIES-ONLY IMPORT BEI STARTUP
# Aktiviert automatischen Series-Only Import beim Start
# Keine Timeout-Probleme - synchrone Ausführung beim Boot
# Nach erfolgreichem Import wieder auf false setzen!
# ===========================================
app.dataimport.series.enabled=false
app.dataimport.series.filepath=src/main/java/com/example/physiokalendar/dataimport/backup.json

# Flyway (dev): Dev-DB darf **nicht** von Flyway verändert werden — Deaktiviert
# (verhindert Ausführung von db/migration SQL‑Skripten gegen DEV mit vorhandenen Testdaten)
spring.flyway.enabled=false

# (Fallback-Baseline-Konfiguration bleibt dokumentiert, falls später wieder aktiviert)
# spring.flyway.baseline-on-migrate=true
# spring.flyway.baseline-version=2

# -------------------------
# Dev logging (reduce noise)
# - Root=INFO  => suppress noisy library DEBUG/TRACE
# - App=DEBUG  => still see app-specific debug messages
# - Hibernate SQL logging set to INFO to hide SQL by default
# -------------------------

# Set correct port for dev
server.port=8082
logging.level.root=INFO
logging.level.com.example.physiokalendar=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

