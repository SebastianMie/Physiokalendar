name: Build & Deploy → Prod Backend

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy-prod:
    runs-on: [self-hosted]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag is on master branch
        if: github.event_name == 'push'
        run: |
          TAG_NAME=${GITHUB_REF##*/}
          echo "Verifying tag $TAG_NAME is on master branch..."
          TAG_COMMIT=$(git rev-list -n 1 $GITHUB_REF)
          BRANCHES=$(git branch -r --contains $TAG_COMMIT)

          if echo "$BRANCHES" | grep -q "origin/master"; then
            echo "✓ Tag is on master branch"
          else
            echo "✗ Tag NOT on master branch - skipping deployment"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend with Maven
        run: ./mvnw.cmd clean package -DskipTests

      - name: Build Docker image
        run: docker build -t physio-prod-backend:latest -f Dockerfile.prod .

      - name: Deploy to PROD stack
        run: |
          cd ${{ github.workspace }}
          COMPOSE_PROJECT_NAME=physio-prod docker compose -f compose.prod.yml --env-file .env.prod up -d --no-deps physio-prod-backend
          sleep 6
          echo "Waiting for backend health check..."
          curl --fail -sS http://localhost:8082/actuator/health || exit 1
          echo "✓ Backend deployed and healthy"
