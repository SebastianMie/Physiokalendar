name: Build & Deploy → Test Backend

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy-test:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag is on test branch
        run: |
          TAG_NAME=${GITHUB_REF##*/}
          echo "Verifying tag $TAG_NAME is on test branch..."
          TAG_COMMIT=$(git rev-list -n 1 $GITHUB_REF)
          BRANCHES=$(git branch -r --contains $TAG_COMMIT)

          if echo "$BRANCHES" | grep -q "origin/test"; then
            echo "✓ Tag is on test branch"
          else
            echo "✗ Tag NOT on test branch - skipping deployment"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend with Maven
        run: ./mvnw.cmd clean package -DskipTests

      - name: Build Docker image
        run: docker build -t physio-test-backend:latest -f Dockerfile.test .

      - name: Deploy to TEST stack
        run: |
          cd ${{ github.workspace }}
          COMPOSE_PROJECT_NAME=physio-test docker compose -f compose.test.yml --env-file .env.test up -d --no-deps physio-test-backend
          sleep 6
          echo "Waiting for backend health check..."
          curl --fail -sS http://localhost:8082/actuator/health || exit 1
          echo "✓ Backend deployed and healthy"
