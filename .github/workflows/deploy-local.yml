name: Deploy → Docker Desktop (self-hosted)

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Which stack to deploy: dev or test'
        required: false
        default: 'test'

jobs:
  deploy-local:
    name: Deploy to local Docker Desktop
    runs-on: [self-hosted, windows, docker]

    env:
      STACK: ${{ github.event.inputs.stack || 'test' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy (docker compose)
        run: |
          $stack = '${{ github.event.inputs.stack }}'
          if (-not $stack) { $stack = 'test' }
          if ($stack -eq 'dev') { $compose = 'compose.dev.yml'; $envf = '.env.dev' } else { $compose = 'compose.test.yml'; $envf = '.env.test' }
          Write-Host "Using compose file: $compose (env: $envf)"
          docker compose -f $compose --env-file $envf pull || Write-Host 'pull skipped or failed (continuing)'
          docker compose -f $compose --env-file $envf up -d --remove-orphans
        shell: powershell

      - name: Wait / verify container health
        id: healthcheck
        run: |
          $stack = '${{ github.event.inputs.stack }}'
          if (-not $stack) { $stack = 'test' }

          if ($stack -eq 'dev') {
            $containers = @('physio-dev-db')
          } else {
            $containers = @('physio-test-db','physio-test-backend','physio-test-frontend')
          }

          $allOk = $true
          foreach ($c in $containers) {
            Write-Host "Checking container: $c"
            $exists = docker ps -a --filter "name=$c" --format "{{.Names}}"
            if (-not $exists) { Write-Error "Container $c not found"; $allOk = $false; break }

            # prefer Docker health.status if available
            $health = docker inspect --format '{{.State.Health.Status}}' $c 2>$null
            if ($health) {
              Write-Host "$c health: $health"
              if ($health -ne 'healthy') { Write-Error "$c not healthy ($health)"; $allOk = $false; break }
            } else {
              $status = docker inspect --format '{{.State.Status}}' $c
              Write-Host "$c status: $status"
              if ($status -ne 'running') { Write-Error "$c not running ($status)"; $allOk = $false; break }
            }
          }

          if (-not $allOk) { exit 1 }
        shell: powershell

      - name: Smoke test (application health)
        run: |
          if ('${{ github.event.inputs.stack }}' -eq 'dev') {
            # dev stack usually doesn't run containerized backend — skip
            Write-Host 'Dev stack: skipping HTTP smoke test'
            exit 0
          }

          # test backend health endpoint on host (compose.test maps BACKEND_PORT -> 8081 by default)
          $port = ${env:BACKEND_PORT} -as [int]
          if (-not $port) { $port = 8081 }
          $url = "http://localhost:$port/actuator/health"
          Write-Host "Checking app health at $url"
          try {
            $r = Invoke-RestMethod -Uri $url -TimeoutSec 10
            if ($r.status -ne 'UP') { Write-Error "App unhealthy: $($r | ConvertTo-Json -Depth 3)"; exit 1 }
            Write-Host 'Application reported UP'
          } catch {
            Write-Error "HTTP healthcheck failed: $_"; exit 1
          }
        shell: powershell

      - name: Collect logs (on failure)
        if: failure()
        id: collect_logs
        run: |
          $stack = '${{ github.event.inputs.stack }}'
          if (-not $stack) { $stack = 'test' }

          if ($stack -eq 'dev') {
            $targets = @('physio-dev-db')
          } else {
            $targets = @('physio-test-backend','physio-test-db','physio-test-frontend')
          }

          foreach ($t in $targets) {
            $logs = ''
            try { $logs = docker logs $t --tail 400 2>&1 } catch { $logs = "(no logs for $t)" }
            Write-Host "Writing logs output for $t to GITHUB_OUTPUT"
            "${t}_logs<<'EOF'" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            $logs | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        shell: powershell

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v6
        env:
          BACKEND_LOGS: ${{ steps.collect_logs.outputs['physio-test-backend_logs'] }}
          DB_LOGS: ${{ steps.collect_logs.outputs['physio-test-db_logs'] }}
          FRONTEND_LOGS: ${{ steps.collect_logs.outputs['physio-test-frontend_logs'] }}
        with:
          script: |
            const title = `[ALERT] Deploy failed on runner ${process.env['RUNNER_NAME'] || 'self-hosted'}`;
            const body = `**Workflow**: ${context.workflow}\n**Ref**: ${process.env.GITHUB_REF}\n**Runner**: ${process.env.RUNNER_NAME}\n\n**Backend logs (tail)**:\n\n\`\`\`\n${process.env.BACKEND_LOGS || '(no backend logs)'}\n\`\`\`\n\n**DB logs (tail)**:\n\n\`\`\`\n${process.env.DB_LOGS || '(no db logs)'}\n\`\`\`\n\n**Frontend logs (tail)**:\n\n\`\`\`\n${process.env.FRONTEND_LOGS || '(no frontend logs)'}\n\`\`\`\n`;
            await github.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['incident','auto-deploy'] });
