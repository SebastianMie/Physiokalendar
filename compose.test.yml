# Test Docker Compose Stack
# Ports: Frontend 4201, Backend 8081, DB 3307
# Usage: docker compose -f compose.test.yml --env-file .env.test up -d

services:
  physio-test-db:
    image: mysql:8.0.36
    container_name: ${COMPOSE_PROJECT_NAME:-physio-test}-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-physiocalendar_test}
      MYSQL_USER: ${DB_USER:-physiouser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-testpassword}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-testrootpassword}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - physio-test-db-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./backups:/backup
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      physio-test-network:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-physio-test}-db

  physio-test-backend:
    container_name: ${COMPOSE_PROJECT_NAME:-physio-test}-backend
    image: physio-test-backend:latest
    restart: unless-stopped
    depends_on:
      physio-test-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://physio-test-db:3306/${DB_NAME:-physiocalendar_test}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-physiouser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-testpassword}
      APP_ENVIRONMENT: test
      MAIL_ENABLED: "false"
      MAIL_REDIRECT_ALL: "true"
      MAIL_REDIRECT_TO: ${TEST_MAIL_TO:-test-inbox@localhost}
      SEED_DATA_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      physio-test-network:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-physio-test}-backend
          - backend

  physio-test-frontend:
    # Use a prebuilt frontend image for test deploys (CI should push this image).
    # Local development can still mount the frontend via compose.override.yml
    container_name: ${COMPOSE_PROJECT_NAME:-physio-test}-frontend
    image: ${FRONTEND_IMAGE:-physio-test-frontend:latest}
    restart: unless-stopped
    depends_on:
      - physio-test-backend
    environment:
      API_URL: http://physio-test-backend:8080
    ports:
      - "${FRONTEND_PORT:-4201}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - physio-test-network

  physio-test-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: ${COMPOSE_PROJECT_NAME:-physio-test}-backup
    image: physio-test-backup:latest
    restart: unless-stopped
    environment:
      DB_HOST: physio-test-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-physiocalendar_test}
      DB_USER: ${DB_USER:-physiouser}
      DB_PASSWORD: ${DB_PASSWORD:-testpassword}
    volumes:
      - ./backups:/backup
    networks:
      - physio-test-network
    depends_on:
      physio-test-db:
        condition: service_healthy

volumes:
  physio-test-db-data:
    name: physio-test-db-data
    external: true

networks:
  physio-test-network:
    name: physio-test-network
    driver: bridge
    external: true
