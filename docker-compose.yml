version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./src:/usr/src/app/src
      - ./target:/usr/src/app/target
      - ./pom.xml:/usr/src/app/pom.xml
      - ~/.m2:/root/.m2  # Optional: cache your Maven dependencies
    environment:
      - JAVA_HOME=/usr/local/openjdk-17
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/physiocalendar
      - SPRING_DATASOURCE_USERNAME=physiouser
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - db

  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: physiocalendar
      MYSQL_USER: physiouser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
