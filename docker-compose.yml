# Development docker-compose: Nur Datenbank - Backend läuft lokal mit Hot-Reload
services:
  db:
    image: mysql:8.0.36
    restart: always
    environment:
      MYSQL_DATABASE: physiocalendar
      MYSQL_USER: physiouser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

volumes:
  db_data:
