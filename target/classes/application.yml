spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/physiocalendar}
    username: ${SPRING_DATASOURCE_USERNAME:physiouser}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: false

# Application Config
app:
  environment: ${APP_ENVIRONMENT:dev}
  seed-data-enabled: ${SEED_DATA_ENABLED:false}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:physiokalendarSecretKey2026VeryLongSecretKeyForHS256Algorithm}
  expiration: 86400000  # 24 hours in milliseconds

# Mail Configuration
mail:
  enabled: ${MAIL_ENABLED:false}
  redirect:
    all: ${MAIL_REDIRECT_ALL:true}
    to: ${TEST_MAIL_TO:dev-inbox@localhost}
    subject-prefix: "[DEV] "

# Audit Configuration
audit:
  log-before-after: true
  log-metadata: true

logging:
  level:
    root: DEBUG
    com.example.physiokalendar: DEBUG
    org.flywaydb: INFO
    org.springframework.boot: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
